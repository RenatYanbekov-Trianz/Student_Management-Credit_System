apiVersion: apps/v1
kind: Deployment
metadata:
  name: qldsv-htc-project
  namespace: qldsv-htc-project
  labels:
    app: qldsv-htc-project
    version: "1.0"
    app.kubernetes.io/name: qldsv-htc-project
    app.kubernetes.io/component: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qldsv-htc-project
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: qldsv-htc-project
        version: "1.0"
    spec:
      # Windows node selector — required for Windows container workloads on EKS
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: "os"
          operator: "Equal"
          value: "windows"
          effect: "NoSchedule"
      containers:
        - name: qldsv-htc-project
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            # SQL Server connection string — inject from Kubernetes Secret
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: qldsv-htc-project-secrets
                  key: db-connection-string
            # Health check server port
            - name: HEALTH_CHECK_PORT
              value: "8080"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: logs
              mountPath: C:\app\logs
      volumes:
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
